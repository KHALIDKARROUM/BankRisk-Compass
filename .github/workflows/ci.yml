name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aegis_credit_ci
          POSTGRES_USER: aegis_credit_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_credit_ci -d aegis_credit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEBUG: "True"
      LOGIN_REQUIRED: "False"
      LOCAL_DEMO_MODE: "False"
      DEPLOYMENT_TENANT_ID: ci-lender
      DATABASE_URL: postgresql://aegis_credit_ci:ci-database-password@127.0.0.1:5432/aegis_credit_ci
      DB_SSL_REQUIRE: "False"
      POSTGRES_DB: aegis_credit_ci
      POSTGRES_USER: aegis_credit_ci
      POSTGRES_PASSWORD: ci-database-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate ephemeral test secrets
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import secrets
          print(f"SECRET_KEY={secrets.token_urlsafe(48)}")
          print(f"AUDIT_HMAC_KEY={secrets.token_urlsafe(48)}")
          print(f"FIELD_ENCRYPTION_KEY={base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}")
          print(f"BACKUP_ENCRYPTION_KEY={base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}")
          print(f"MODEL_SIGNING_PUBLIC_KEY={base64.b64encode(secrets.token_bytes(32)).decode()}")
          PY

      - name: Validate dependencies
        run: python -m pip check

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-app.txt requirements-prod.txt
          vulnerability-service: osv

      - name: Compile Python
        run: python -m compileall -q app aegis_credit src

      - name: Validate deployment configuration
        run: |
          bash -n build.sh docker-entrypoint.sh
          docker compose config --quiet
          python - <<'PY'
          import yaml

          with open("render.yaml", encoding="utf-8") as blueprint_file:
              blueprint = yaml.safe_load(blueprint_file)
          services = {service["type"]: service for service in blueprint["services"]}
          assert services["web"]["preDeployCommand"]
          assert "process_batches" in services["worker"]["startCommand"]
          assert "purge_old_cases --confirm" in services["cron"]["startCommand"]
          assert "disk" not in services["web"]
          PY

      - name: Run Django checks
        run: python manage.py check

      - name: Apply migrations and bootstrap roles
        run: |
          python manage.py migrate --no-input
          python manage.py bootstrap_roles

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 2 --noinput

      - name: Run repository-level tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test monitoring tools
        run: |
          python -m src.monitor_model --allow-unsigned-demo --data data/credit_risk.csv --output /tmp/drift.csv
          python -m src.validate_external --allow-unsigned-demo --data data/credit_risk.csv --output /tmp/external.csv

      - name: Run deployment security checks
        env:
          DEBUG: "False"
          LOGIN_REQUIRED: "True"
          LOCAL_DEMO_MODE: "False"
          DEPLOYMENT_TENANT_ID: ci-lender
          ALLOWED_HOSTS: "example.test"
          DB_SSL_REQUIRE: "True"
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy
